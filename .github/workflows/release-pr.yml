# Pre-merge guard for release PRs, the same check the shared rust-full.yml
# runs. release.yml builds the release-branch head and tag-release.yml tags
# the merge commit; the two carry the same tree only while main has not moved.
# tag-release.yml refuses to tag a tree nothing built, but by then the PR is
# merged and cannot be merged again, so a behind branch has to be caught here.
#
# The job is skipped for any other head branch, and a skipped job satisfies a
# required status check, so this can be required without gating other PRs.

name: Release PR

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  up-to-date:
    name: Release branch up to date with main
    if: startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Release branch is not behind its base
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          behind="$(gh api "repos/${REPO}/compare/${BASE_REF}...${HEAD_SHA}" --jq '.behind_by')"
          if [[ "$behind" -gt 0 ]]; then
            echo "::error::This branch is $behind commit(s) behind ${BASE_REF}."
            echo "::error::Merging would produce a tree the release build never built, and the"
            echo "::error::tag would be refused after the merge, when it can no longer be undone."
            echo "::error::Update this branch from ${BASE_REF} and let release.yml rebuild."
            exit 1
          fi
          echo "ok  up to date with ${BASE_REF}; the merge will carry the tree that was built"
