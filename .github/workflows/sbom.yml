name: SBOM Generation & License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this so the SBOM attached to a release is generated from
  # the release branch, under the repository's own license policy.
  workflow_call:
    inputs:
      retention-days:
        description: Artifact retention; release.yml passes 30 so publish.yml can still find it at the tag
        type: number
        default: 90

# Supersede an in-flight run when a PR is pushed again. The literal prefix
# keeps this group distinct from release.yml's when called from it, where
# github.workflow names the caller.
concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sbom-compliance:
    name: Generate SBOM & Check License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99

      # Prebuilt binary rather than `cargo install`, which compiled
      # cargo-cyclonedx from source on every push and pull request.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-cyclonedx

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Install scancode-toolkit
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install scancode-toolkit pluggy==1.6.0

      - name: Install CycloneDX CLI
        run: |
          mkdir -p ~/.local/bin
          wget -q -O ~/.local/bin/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.33.1/cyclonedx-linux-x64
          # Verify SHA-256 checksum (from CycloneDX v0.33.1 release)
          echo "bfc8b2538da86fe239bc53658bbb63c1c8c510a293c1e6891aa5bea5d3c58746  $HOME/.local/bin/cyclonedx" | sha256sum -c -
          chmod +x ~/.local/bin/cyclonedx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Complete SBOM
        run: .github/scripts/generate_sbom.sh

      - name: Validate SBOM Format
        run: cyclonedx validate --input-file sbom.json

      - name: Check License Policy
        run: python3 .github/scripts/check_license_policy.py sbom.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days || 90 }}

      - name: Fail on License Violations
        if: failure()
        run: |
          echo "❌ SBOM generation or license policy check failed!"
          echo "Review the output above for details."
          exit 1
