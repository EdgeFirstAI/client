name: SBOM Generation & License Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Supersede an in-flight run when a PR is pushed again, but never on main:
# release.yml resolves this workflow's run for a specific SHA, and a blanket
# cancel would destroy the run a release depends on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  sbom-compliance:
    name: Generate SBOM & Check License Compliance
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: 1.94

      # Prebuilt binary rather than `cargo install`, which compiled
      # cargo-cyclonedx from source on every push and pull request.
      - name: Install cargo-cyclonedx
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: cargo-cyclonedx

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install scancode-toolkit
        run: |
          python3 -m venv venv
          venv/bin/pip install --upgrade pip
          venv/bin/pip install scancode-toolkit

      - name: Install CycloneDX CLI
        run: |
          mkdir -p ~/.local/bin
          wget -q -O ~/.local/bin/cyclonedx \
            https://github.com/CycloneDX/cyclonedx-cli/releases/download/v0.27.1/cyclonedx-linux-x64
          # Verify SHA-256 checksum (from CycloneDX v0.27.1 release)
          echo "b36a12d5103c1fd799005e02ee8d5a546c8db5b67f770bb28786f15238ceac16  $HOME/.local/bin/cyclonedx" | sha256sum -c -
          chmod +x ~/.local/bin/cyclonedx
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Generate Complete SBOM
        run: .github/scripts/generate_sbom.sh

      - name: Validate SBOM Format
        run: cyclonedx validate --input-file sbom.json

      - name: Check License Policy
        run: python3 .github/scripts/check_license_policy.py sbom.json

      - name: Upload SBOM Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sbom
          path: sbom.json
          retention-days: 90

      - name: Fail on License Violations
        if: failure()
        run: |
          echo "❌ SBOM generation or license policy check failed!"
          echo "Review the output above for details."
          exit 1
