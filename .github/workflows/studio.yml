name: Studio Integration Tests

# Manual workflow for running tests against EdgeFirst Studio servers
# Triggered from GitHub Actions UI with configurable options

on:
  # Nightly across every environment. The PR lane deliberately runs no Studio
  # tests at all (see test.yml), so this is what keeps the integration paths
  # honest -- a failure here points at a commit range rather than blocking
  # somebody's pull request.
  # Deliberately off the hour: scheduled runs are best-effort, and the top of
  # the hour is the most contended slot, so :00 crons are the likeliest to be
  # delayed or dropped.
  #
  # No failure notification is wired up yet. Be aware of what that means: for
  # a `schedule` event GitHub notifies only the user who last modified this
  # cron line -- not the repository owner and not the team. Editing the line
  # below silently transfers the alerts to whoever made the edit.
  schedule:
    - cron: '17 7 * * *'   # 07:17 UTC daily

  workflow_dispatch:
    inputs:
      studio_server:
        description: 'EdgeFirst Studio server environment'
        required: true
        type: choice
        options:
          - dev
          - test
          - stage
          - saas
          - ocean
        default: 'test'
      include_ignored:
        description: 'Run ALL tests including ignored ones'
        required: true
        type: boolean
        default: false

run-name: Studio Tests - ${{ inputs.studio_server || 'nightly (test, stage, saas)' }}${{ inputs.include_ignored && ' (all tests)' || '' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUST_STABLE_VERSION: "1.94"
  RUST_LOG: "edgefirst_client=trace"
  # Coverage is collected from exactly ONE matrix leg. The three servers run the
  # same code against different data, so instrumenting all of them would triple
  # the cost to produce three near-identical reports. `stage` is the choice
  # because it is the most production-like environment that is still safe to
  # write to.
  #
  # If this value ever stops matching a server in the matrix, no leg instruments
  # and the sonarcloud job below fails on the missing artifact rather than
  # silently publishing unit-test-only coverage.
  COVERAGE_SERVER: stage

jobs:
  # A scheduled run has no `inputs`, so the server list cannot come from them.
  # This resolves it once for both trigger types and hands it to every job's
  # matrix: all three environments nightly, or just the chosen one on dispatch.
  prepare:
    name: Resolve target servers
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      servers: ${{ steps.pick.outputs.servers }}
      coverage: ${{ steps.pick.outputs.coverage }}
    steps:
      - name: Pick servers
        id: pick
        # `coverage` is resolved here rather than in the sonarcloud job's `if`
        # because a job-level `if` cannot read workflow-level `env`, so it has no
        # way to see COVERAGE_SERVER. Deciding it once, here, keeps the constant
        # in a single place instead of hardcoding 'stage' in a condition that
        # would silently drift out of sync with the env block.
        # COVERAGE_SERVER comes from the workflow-level env block and is already
        # in the shell environment; only the dispatch input needs mapping here.
        env:
          DISPATCH_SERVER: ${{ inputs.studio_server }}
        run: |
          set -euo pipefail
          if [ -n "$DISPATCH_SERVER" ]; then
            printf 'servers=["%s"]\n' "$DISPATCH_SERVER" >> "$GITHUB_OUTPUT"
            SERVERS="$DISPATCH_SERVER"
          else
            echo 'servers=["test","stage","saas"]' >> "$GITHUB_OUTPUT"
            SERVERS="test stage saas"
          fi

          # Coverage only exists when the instrumented leg is actually running.
          # A dispatch against a single non-stage server produces no reports, and
          # the scan must be skipped rather than fail on a missing artifact.
          COVERAGE=false
          for s in $SERVERS; do
            if [ "$s" = "$COVERAGE_SERVER" ]; then
              COVERAGE=true
            fi
          done
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"

          cat "$GITHUB_OUTPUT"

  rust-client-lib:
    name: Rust Client Library (${{ matrix.server }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set_result.outputs.result }}
      passed: ${{ steps.set_result.outputs.passed }}
      failed: ${{ steps.set_result.outputs.failed }}
      ignored: ${{ steps.set_result.outputs.ignored }}
    steps:
      - name: Remove Junk from Host
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          verbose: 'true'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: studio-rust-client
          shared-key: "stable"
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        if: matrix.server == env.COVERAGE_SERVER
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: cargo-llvm-cov

      # Exported into GITHUB_ENV so the cargo invocation below inherits the
      # instrumentation flags, exactly as test.yml does for the unit lane.
      # Writes the env to a file instead of GITHUB_ENV. `cargo llvm-cov nextest`
      # below applies its own instrumentation and fails if it inherits one, so
      # only the Python steps source this.
      - name: Set up coverage instrumentation
        if: matrix.server == env.COVERAGE_SERVER
        run: ./.github/scripts/setup-coverage-env.sh

      - name: Create output directories
        run: mkdir -p test-results test-logs

      # `--run-ignored all` is unconditional here, NOT gated on include_ignored.
      # In this crate `#[ignore]` means "needs a live Studio server" (see the
      # module docs on `mod tests` in edgefirst-client/src/lib.rs), and this
      # workflow is the thing that supplies one. Gating it would mean the
      # nightly silently ran zero of the twelve Studio tests -- passing green
      # while checking nothing, which is worse than failing.
      #
      # Trade-off, stated plainly: there is now no way to disable an individual
      # test in this crate via `#[ignore]`. Use a nextest filter if that comes up.
      - name: Run edgefirst-client lib tests
        id: tests
        run: |
          set +e
          # Same tests either way; only the coverage leg pays for
          # instrumentation. It must be `cargo llvm-cov nextest`, not a bare
          # `cargo nextest run` under an exported environment -- the latter runs
          # the tests but drops the integration binaries from the report.
          if [ "${{ matrix.server }}" = "${{ env.COVERAGE_SERVER }}" ]; then
            RUNNER=(cargo llvm-cov nextest --no-report)
          else
            RUNNER=(cargo nextest run)
          fi
          "${RUNNER[@]}" \
            --locked \
            --no-fail-fast \
            --profile ci \
            -p edgefirst-client \
            --lib \
            --run-ignored all \
            2>&1 | tee test-logs/rust-client-lib.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE
        env:
          STUDIO_SERVER: ${{ matrix.server }}
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      - name: Parse test results and generate JUnit XML
        id: parse
        if: always()
        run: |
          LOG_FILE="test-logs/rust-client-lib.log"
          RESULT_LINE=$(grep -E "^test result:" "$LOG_FILE" | tail -1 || echo "")
          
          if [ -n "$RESULT_LINE" ]; then
            PASSED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= passed)' || echo "0")
            FAILED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= failed)' || echo "0")
            IGNORED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= ignored)' || echo "0")
          else
            PASSED=0
            FAILED=0
            IGNORED=0
          fi
          
          TOTAL=$((PASSED + FAILED))
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ignored=$IGNORED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          
          # Generate JUnit XML
          cat > test-results/rust-client-lib-junit.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="edgefirst-client lib" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
            <testsuite name="edgefirst-client" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
          EOF
          
          grep -E "^test .+ \.\.\. (ok|FAILED|ignored)" "$LOG_FILE" | while read -r line; do
            TEST_NAME=$(echo "$line" | sed -E 's/^test ([^ ]+) \.\.\..*$/\1/')
            STATUS=$(echo "$line" | grep -oE '(ok|FAILED|ignored)$')
            
            echo "    <testcase name=\"$TEST_NAME\" classname=\"edgefirst-client\">" >> test-results/rust-client-lib-junit.xml
            if [ "$STATUS" = "FAILED" ]; then
              echo "      <failure message=\"Test failed\">See logs for details</failure>" >> test-results/rust-client-lib-junit.xml
            elif [ "$STATUS" = "ignored" ]; then
              echo "      <skipped/>" >> test-results/rust-client-lib-junit.xml
            fi
            echo "    </testcase>" >> test-results/rust-client-lib-junit.xml
          done
          
          cat >> test-results/rust-client-lib-junit.xml << EOF
            </testsuite>
          </testsuites>
          EOF

      - name: Set result output
        id: set_result
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" = "0" ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          echo "passed=${{ steps.parse.outputs.passed }}" >> $GITHUB_OUTPUT
          echo "failed=${{ steps.parse.outputs.failed }}" >> $GITHUB_OUTPUT
          echo "ignored=${{ steps.parse.outputs.ignored }}" >> $GITHUB_OUTPUT

      # The step above runs `--lib`, which excludes the wiremock_coverage test
      # binary. Without this the nightly lcov would report every wiremock-only
      # path as uncovered and the project number would go DOWN, not up.
      #
      # Deliberately not allowed to fail the job: these tests need no credentials
      # and already gate every pull request, so a failure here is a duplicate
      # signal. It is collected for coverage, not as a second opinion.
      - name: Cover the credential-free test binaries
        if: always() && matrix.server == env.COVERAGE_SERVER
        continue-on-error: true
        run: |
          cargo llvm-cov nextest --no-report --locked --no-fail-fast --profile ci \
            -E 'not binary(cli) and not kind(lib)'

      # Generated even when tests fail: partial coverage from a red run is still
      # the truest picture of what these tests reach, and withholding it would
      # silently drop the project's number back to unit-only.
      - name: Generate coverage report
        if: always() && matrix.server == env.COVERAGE_SERVER
        run: cargo llvm-cov report --lcov --output-path lcov-client-lib.info

      - name: Upload coverage report
        if: always() && matrix.server == env.COVERAGE_SERVER
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: studio-coverage-client-lib
          path: lcov-client-lib.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-client-lib-results-${{ matrix.server }}
          path: |
            test-results/
            test-logs/
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"
          PASSED="${{ steps.parse.outputs.passed }}"
          FAILED="${{ steps.parse.outputs.failed }}"
          IGNORED="${{ steps.parse.outputs.ignored }}"
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo "# ✅ PASSED: Rust Client Library Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ FAILED: Rust Client Library Tests" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Ignored | $IGNORED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> �� Download \`rust-client-lib-results-${{ matrix.server }}\` for JUnit XML and detailed logs" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: always() && steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Rust Client Library tests FAILED with exit code ${{ steps.tests.outputs.exit_code }}"
          exit 1

  rust-cli:
    name: Rust CLI (${{ matrix.server }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set_result.outputs.result }}
      passed: ${{ steps.set_result.outputs.passed }}
      failed: ${{ steps.set_result.outputs.failed }}
      ignored: ${{ steps.set_result.outputs.ignored }}
    steps:
      - name: Remove Junk from Host
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          verbose: 'true'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: studio-rust-cli
          shared-key: "stable"
          save-if: false

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: nextest

      - name: Install cargo-llvm-cov
        if: matrix.server == env.COVERAGE_SERVER
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: cargo-llvm-cov

      # This is the leg that matters most for the project number: the CLI suite
      # is the only thing that exercises main.rs, which the unit lane leaves at
      # roughly a quarter covered.
      # Writes the env to a file instead of GITHUB_ENV. `cargo llvm-cov nextest`
      # below applies its own instrumentation and fails if it inherits one, so
      # only the Python steps source this.
      - name: Set up coverage instrumentation
        if: matrix.server == env.COVERAGE_SERVER
        run: ./.github/scripts/setup-coverage-env.sh

      - name: Create output directories
        run: mkdir -p test-results test-logs

      - name: Run edgefirst-cli tests
        id: tests
        run: |
          set +e
          # See the note on the client-lib job: the coverage leg must go through
          # `cargo llvm-cov nextest`, or the cli integration binary -- which is
          # the only thing that exercises main.rs -- contributes nothing.
          if [ "${{ matrix.server }}" = "${{ env.COVERAGE_SERVER }}" ]; then
            RUNNER=(cargo llvm-cov nextest --no-report)
          else
            RUNNER=(cargo nextest run)
          fi
          "${RUNNER[@]}" \
            --locked \
            --no-fail-fast \
            --profile ci \
            -p edgefirst-cli \
            ${{ inputs.include_ignored && '--run-ignored all' || '' }} \
            2>&1 | tee test-logs/rust-cli.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE
        env:
          STUDIO_SERVER: ${{ matrix.server }}
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      - name: Parse test results and generate JUnit XML
        id: parse
        if: always()
        run: |
          LOG_FILE="test-logs/rust-cli.log"
          RESULT_LINE=$(grep -E "^test result:" "$LOG_FILE" | tail -1 || echo "")
          
          if [ -n "$RESULT_LINE" ]; then
            PASSED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= passed)' || echo "0")
            FAILED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= failed)' || echo "0")
            IGNORED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= ignored)' || echo "0")
          else
            PASSED=0
            FAILED=0
            IGNORED=0
          fi
          
          TOTAL=$((PASSED + FAILED))
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ignored=$IGNORED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          
          cat > test-results/rust-cli-junit.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="edgefirst-cli" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
            <testsuite name="edgefirst-cli" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
          EOF
          
          grep -E "^test .+ \.\.\. (ok|FAILED|ignored)" "$LOG_FILE" | while read -r line; do
            TEST_NAME=$(echo "$line" | sed -E 's/^test ([^ ]+) \.\.\..*$/\1/')
            STATUS=$(echo "$line" | grep -oE '(ok|FAILED|ignored)$')
            
            echo "    <testcase name=\"$TEST_NAME\" classname=\"edgefirst-cli\">" >> test-results/rust-cli-junit.xml
            if [ "$STATUS" = "FAILED" ]; then
              echo "      <failure message=\"Test failed\">See logs for details</failure>" >> test-results/rust-cli-junit.xml
            elif [ "$STATUS" = "ignored" ]; then
              echo "      <skipped/>" >> test-results/rust-cli-junit.xml
            fi
            echo "    </testcase>" >> test-results/rust-cli-junit.xml
          done
          
          cat >> test-results/rust-cli-junit.xml << EOF
            </testsuite>
          </testsuites>
          EOF

      - name: Set result output
        id: set_result
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" = "0" ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          echo "passed=${{ steps.parse.outputs.passed }}" >> $GITHUB_OUTPUT
          echo "failed=${{ steps.parse.outputs.failed }}" >> $GITHUB_OUTPUT
          echo "ignored=${{ steps.parse.outputs.ignored }}" >> $GITHUB_OUTPUT

      - name: Generate coverage report
        if: always() && matrix.server == env.COVERAGE_SERVER
        run: cargo llvm-cov report --lcov --output-path lcov-cli.info

      - name: Upload coverage report
        if: always() && matrix.server == env.COVERAGE_SERVER
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: studio-coverage-cli
          path: lcov-cli.info
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-cli-results-${{ matrix.server }}
          path: |
            test-results/
            test-logs/
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"
          PASSED="${{ steps.parse.outputs.passed }}"
          FAILED="${{ steps.parse.outputs.failed }}"
          IGNORED="${{ steps.parse.outputs.ignored }}"
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo "# ✅ PASSED: Rust CLI Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ FAILED: Rust CLI Tests" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Ignored | $IGNORED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> �� Download \`rust-cli-results-${{ matrix.server }}\` for JUnit XML and detailed logs" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: always() && steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Rust CLI tests FAILED with exit code ${{ steps.tests.outputs.exit_code }}"
          exit 1

  rust-doc:
    name: Rust Doc Tests (${{ matrix.server }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set_result.outputs.result }}
      passed: ${{ steps.set_result.outputs.passed }}
      failed: ${{ steps.set_result.outputs.failed }}
      ignored: ${{ steps.set_result.outputs.ignored }}
    steps:
      - name: Remove Junk from Host
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          verbose: 'true'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: studio-rust-doc
          shared-key: "stable"
          save-if: false

      - name: Create output directories
        run: mkdir -p test-results test-logs

      - name: Run doc tests
        id: tests
        run: |
          set +e
          cargo test --doc --locked 2>&1 | tee test-logs/rust-doc.log
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE
        env:
          STUDIO_SERVER: ${{ matrix.server }}
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      - name: Parse test results and generate JUnit XML
        id: parse
        if: always()
        run: |
          LOG_FILE="test-logs/rust-doc.log"
          RESULT_LINE=$(grep -E "^test result:" "$LOG_FILE" | tail -1 || echo "")
          
          if [ -n "$RESULT_LINE" ]; then
            PASSED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= passed)' || echo "0")
            FAILED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= failed)' || echo "0")
            IGNORED=$(echo "$RESULT_LINE" | grep -oP '\d+(?= ignored)' || echo "0")
          else
            PASSED=0
            FAILED=0
            IGNORED=0
          fi
          
          TOTAL=$((PASSED + FAILED))
          
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "ignored=$IGNORED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          
          cat > test-results/rust-doc-junit.xml << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="doc-tests" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
            <testsuite name="doc-tests" tests="$TOTAL" failures="$FAILED" errors="0" skipped="$IGNORED">
          EOF
          
          grep -E "^test .+ \.\.\. (ok|FAILED|ignored)" "$LOG_FILE" | while read -r line; do
            TEST_NAME=$(echo "$line" | sed -E 's/^test ([^ ]+) \.\.\..*$/\1/')
            STATUS=$(echo "$line" | grep -oE '(ok|FAILED|ignored)$')
            
            echo "    <testcase name=\"$TEST_NAME\" classname=\"doc-tests\">" >> test-results/rust-doc-junit.xml
            if [ "$STATUS" = "FAILED" ]; then
              echo "      <failure message=\"Test failed\">See logs for details</failure>" >> test-results/rust-doc-junit.xml
            elif [ "$STATUS" = "ignored" ]; then
              echo "      <skipped/>" >> test-results/rust-doc-junit.xml
            fi
            echo "    </testcase>" >> test-results/rust-doc-junit.xml
          done
          
          cat >> test-results/rust-doc-junit.xml << EOF
            </testsuite>
          </testsuites>
          EOF

      - name: Set result output
        id: set_result
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" = "0" ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          echo "passed=${{ steps.parse.outputs.passed }}" >> $GITHUB_OUTPUT
          echo "failed=${{ steps.parse.outputs.failed }}" >> $GITHUB_OUTPUT
          echo "ignored=${{ steps.parse.outputs.ignored }}" >> $GITHUB_OUTPUT

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: rust-doc-results-${{ matrix.server }}
          path: |
            test-results/
            test-logs/
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"
          PASSED="${{ steps.parse.outputs.passed }}"
          FAILED="${{ steps.parse.outputs.failed }}"
          IGNORED="${{ steps.parse.outputs.ignored }}"
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo "# ✅ PASSED: Rust Doc Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ FAILED: Rust Doc Tests" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Ignored | $IGNORED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📥 Download \`rust-doc-results-${{ matrix.server }}\` for JUnit XML and detailed logs" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: always() && steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Rust Doc tests FAILED with exit code ${{ steps.tests.outputs.exit_code }}"
          exit 1

  python-lib:
    name: Python Library (${{ matrix.server }})
    needs: [prepare]
    strategy:
      fail-fast: false
      matrix:
        server: ${{ fromJSON(needs.prepare.outputs.servers) }}
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.set_result.outputs.result }}
      passed: ${{ steps.set_result.outputs.passed }}
      failed: ${{ steps.set_result.outputs.failed }}
      ignored: ${{ steps.set_result.outputs.ignored }}
    steps:
      - name: Remove Junk from Host
        uses: AdityaGarg8/remove-unwanted-software@90e01b21170618765a73370fcc3abbd1684a7793 # v5
        with:
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
          remove-large-packages: 'true'
          verbose: 'true'

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: studio-python-lib
          shared-key: "stable"
          save-if: false

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build and install Python package
        run: |
          maturin build --locked -m crates/edgefirst-client-py/Cargo.toml
          pip install target/wheels/edgefirst_client-*.whl

      - name: Create output directories
        run: mkdir -p test-results test-logs

      # Only the coverage leg pays for slipcover; the other servers run the same
      # tests bare. Both branches invoke the identical xmlrunner discovery, so
      # the result parsing below sees the same output either way.
      - name: Run Python tests
        id: tests
        run: |
          set +e
          if [ "${{ matrix.server }}" = "${{ env.COVERAGE_SERVER }}" ]; then
            python3 -m slipcover --xml --out coverage.xml \
              -m xmlrunner discover -s . -p "test*.py" -o test-results -v 2>&1 \
              | tee test-logs/python-lib.log
          else
            python3 -m xmlrunner discover -s . -p "test*.py" -o test-results -v 2>&1 \
              | tee test-logs/python-lib.log
          fi
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          exit $TEST_EXIT_CODE
        env:
          STUDIO_SERVER: ${{ matrix.server }}
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask
          RUST_LOG: "edgefirst_client=trace"

      - name: Parse test results
        id: parse
        if: always()
        run: |
          # Parse from xmlrunner output files
          if ls test-results/TEST-*.xml 1> /dev/null 2>&1; then
            TOTAL=$(grep -h '<testsuite' test-results/TEST-*.xml | grep -oP 'tests="\K\d+' | awk '{s+=$1} END {print s+0}')
            FAILURES=$(grep -h '<testsuite' test-results/TEST-*.xml | grep -oP 'failures="\K\d+' | awk '{s+=$1} END {print s+0}')
            ERRORS=$(grep -h '<testsuite' test-results/TEST-*.xml | grep -oP 'errors="\K\d+' | awk '{s+=$1} END {print s+0}')
            SKIPPED=$(grep -h '<testsuite' test-results/TEST-*.xml | grep -oP 'skipped="\K\d+' | awk '{s+=$1} END {print s+0}')
            FAILED=$((FAILURES + ERRORS))
            PASSED=$((TOTAL - FAILED - SKIPPED))
          else
            # Fallback to parsing unittest output
            TOTAL=0
            PASSED=0
            FAILED=0
            SKIPPED=0
            if grep -q "^OK" test-logs/python-lib.log; then
              PASSED=$(grep -oP 'Ran \K\d+' test-logs/python-lib.log || echo "0")
              TOTAL=$PASSED
            elif grep -q "^FAILED" test-logs/python-lib.log; then
              TOTAL=$(grep -oP 'Ran \K\d+' test-logs/python-lib.log || echo "0")
              FAILED=$(grep -oP 'failures=\K\d+' test-logs/python-lib.log || echo "0")
              ERRORS=$(grep -oP 'errors=\K\d+' test-logs/python-lib.log || echo "0")
              FAILED=$((FAILED + ERRORS))
              PASSED=$((TOTAL - FAILED))
            fi
          fi
          
          echo "passed=${PASSED:-0}" >> $GITHUB_OUTPUT
          echo "failed=${FAILED:-0}" >> $GITHUB_OUTPUT
          echo "ignored=${SKIPPED:-0}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL:-0}" >> $GITHUB_OUTPUT

      - name: Set result output
        id: set_result
        if: always()
        run: |
          if [ "${{ steps.tests.outputs.exit_code }}" = "0" ]; then
            echo "result=passed" >> $GITHUB_OUTPUT
          else
            echo "result=failed" >> $GITHUB_OUTPUT
          fi
          echo "passed=${{ steps.parse.outputs.passed }}" >> $GITHUB_OUTPUT
          echo "failed=${{ steps.parse.outputs.failed }}" >> $GITHUB_OUTPUT
          echo "ignored=${{ steps.parse.outputs.ignored }}" >> $GITHUB_OUTPUT

      - name: Upload Python coverage report
        if: always() && matrix.server == env.COVERAGE_SERVER
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: studio-coverage-python
          path: coverage.xml
          retention-days: 7
          if-no-files-found: error

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-lib-results-${{ matrix.server }}
          path: |
            test-results/
            test-logs/
          retention-days: 30

      - name: Generate job summary
        if: always()
        run: |
          EXIT_CODE="${{ steps.tests.outputs.exit_code }}"
          PASSED="${{ steps.parse.outputs.passed }}"
          FAILED="${{ steps.parse.outputs.failed }}"
          IGNORED="${{ steps.parse.outputs.ignored }}"
          
          if [ "$EXIT_CODE" = "0" ]; then
            echo "# ✅ PASSED: Python Library Tests" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ FAILED: Python Library Tests" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          echo "| ⏭️ Skipped | $IGNORED |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📥 Download \`python-lib-results-${{ matrix.server }}\` for JUnit XML and detailed logs" >> $GITHUB_STEP_SUMMARY

      - name: Fail job if tests failed
        if: always() && steps.tests.outputs.exit_code != '0'
        run: |
          echo "::error::Python Library tests FAILED with exit code ${{ steps.tests.outputs.exit_code }}"
          exit 1

  # Publishes the project's authoritative coverage number.
  #
  # test.yml scans pull requests with unit-lane coverage only; this scans the
  # default branch with unit + Studio coverage combined. They are deliberately
  # split that way because both write to the same SonarCloud project, and a
  # branch analysis carrying only unit coverage would overwrite this one --
  # making the project number flap between roughly 62% and 71% depending on
  # which workflow finished last.
  #
  # The consequence to be aware of: the default branch is only re-analysed
  # nightly, so its rating can lag a merge by up to a day. Pull-request analysis
  # is unaffected and still runs on every push. The quality gate scores new code
  # on the PR, and none of its five conditions is a coverage threshold, so
  # nothing is gated on the number this job publishes.
  sonarcloud:
    name: SonarCloud Analysis (full coverage)
    runs-on: ubuntu-24.04
    needs: [prepare, rust-client-lib, rust-cli, python-lib]
    timeout-minutes: 20
    # Runs on partial success: coverage is uploaded under `always()` by each
    # producer, so a red integration test still leaves a usable report. Skipped
    # and cancelled are excluded because those produce no artifacts at all.
    #
    # `!cancelled()` is required for the same reason as in test.yml -- without a
    # status check function GitHub applies an implicit `success()` and the
    # `== 'failure'` branches below can never fire.
    if: >
      !cancelled() &&
      needs.prepare.outputs.coverage == 'true' &&
      (needs.rust-client-lib.result == 'success' || needs.rust-client-lib.result == 'failure') &&
      (needs.rust-cli.result == 'success' || needs.rust-cli.result == 'failure')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: studio-coverage-*
          merge-multiple: true

      # Fails loudly on a missing lcov. Letting the scan proceed without one
      # would publish a near-zero Rust coverage figure over a perfectly good
      # previous number -- worse than not scanning at all.
      - name: Verify coverage files
        run: |
          set -euo pipefail
          for f in lcov-client-lib.info lcov-cli.info; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty — refusing to publish coverage that would read as zero"
              exit 1
            fi
            echo "$f: $(wc -l < "$f") lines"
          done

          # Python coverage is not fatal: the repo has very little Python outside
          # the tests themselves, so a missing report is worth a warning, not a
          # failed scan.
          if [ -s coverage.xml ]; then
            echo "coverage.xml: $(wc -l < coverage.xml) lines"
            echo "PY_COVERAGE_ARG=-Dsonar.python.coverage.reportPaths=coverage.xml" >> "$GITHUB_ENV"
          else
            echo "::warning::coverage.xml missing — Python coverage will not be updated"
            echo "PY_COVERAGE_ARG=" >> "$GITHUB_ENV"
          fi

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          # Overrides sonar.rust.lcov.reportPaths from sonar-project.properties,
          # which names the single lcov.info the PR lane produces.
          args: >
            -Dsonar.rust.lcov.reportPaths=lcov-client-lib.info,lcov-cli.info
            ${{ env.PY_COVERAGE_ARG }}

      - name: Generate SonarCloud summary
        if: always()
        run: |
          {
            echo "## 🔍 SonarCloud Analysis (unit + Studio coverage)"
            echo ""
            echo "Scanned \`${{ github.ref_name }}\` with coverage from the \`${{ env.COVERAGE_SERVER }}\` leg."
            echo ""
            echo "[View Full Report →](https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }})"
          } >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [prepare, rust-client-lib, rust-cli, rust-doc, python-lib]
    if: always()
    steps:
      - name: Generate workflow summary
        run: |
          # Collect results from job outputs
          CLIENT_LIB_RESULT="${{ needs.rust-client-lib.outputs.result }}"
          CLIENT_LIB_PASSED="${{ needs.rust-client-lib.outputs.passed }}"
          CLIENT_LIB_FAILED="${{ needs.rust-client-lib.outputs.failed }}"
          CLIENT_LIB_IGNORED="${{ needs.rust-client-lib.outputs.ignored }}"
          
          CLI_RESULT="${{ needs.rust-cli.outputs.result }}"
          CLI_PASSED="${{ needs.rust-cli.outputs.passed }}"
          CLI_FAILED="${{ needs.rust-cli.outputs.failed }}"
          CLI_IGNORED="${{ needs.rust-cli.outputs.ignored }}"
          
          DOC_RESULT="${{ needs.rust-doc.outputs.result }}"
          DOC_PASSED="${{ needs.rust-doc.outputs.passed }}"
          DOC_FAILED="${{ needs.rust-doc.outputs.failed }}"
          DOC_IGNORED="${{ needs.rust-doc.outputs.ignored }}"
          
          PYTHON_RESULT="${{ needs.python-lib.outputs.result }}"
          PYTHON_PASSED="${{ needs.python-lib.outputs.passed }}"
          PYTHON_FAILED="${{ needs.python-lib.outputs.failed }}"
          PYTHON_IGNORED="${{ needs.python-lib.outputs.ignored }}"
          
          # Calculate totals
          TOTAL_PASSED=$((${CLIENT_LIB_PASSED:-0} + ${CLI_PASSED:-0} + ${DOC_PASSED:-0} + ${PYTHON_PASSED:-0}))
          TOTAL_FAILED=$((${CLIENT_LIB_FAILED:-0} + ${CLI_FAILED:-0} + ${DOC_FAILED:-0} + ${PYTHON_FAILED:-0}))
          TOTAL_IGNORED=$((${CLIENT_LIB_IGNORED:-0} + ${CLI_IGNORED:-0} + ${DOC_IGNORED:-0} + ${PYTHON_IGNORED:-0}))
          TOTAL_TESTS=$((TOTAL_PASSED + TOTAL_FAILED))
          
          # Determine overall status - CLEAR pass/fail based on actual results
          ALL_PASSED="true"
          if [ "$CLIENT_LIB_RESULT" != "passed" ]; then ALL_PASSED="false"; fi
          if [ "$CLI_RESULT" != "passed" ]; then ALL_PASSED="false"; fi
          if [ "$DOC_RESULT" != "passed" ]; then ALL_PASSED="false"; fi
          if [ "$PYTHON_RESULT" != "passed" ]; then ALL_PASSED="false"; fi
          
          if [ "$ALL_PASSED" = "true" ]; then
            echo "# ✅ ALL TESTS PASSED" >> $GITHUB_STEP_SUMMARY
          else
            echo "# ❌ TESTS FAILED" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "## 📊 Overall Results: $TOTAL_PASSED passed, $TOTAL_FAILED failed, $TOTAL_IGNORED ignored" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📋 Test Configuration" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Servers** | \`${{ needs.prepare.outputs.servers }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Include Ignored Tests** | \`${{ inputs.include_ignored }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered By** | @${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${GITHUB_SHA:0:7}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📊 Test Results by Suite" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Result | ✅ Passed | ❌ Failed | ⏭️ Ignored |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|-----------|-----------|------------|" >> $GITHUB_STEP_SUMMARY
          
          # Rust Client Library - CLEAR status
          if [ "$CLIENT_LIB_RESULT" = "passed" ]; then
            echo "| 🦀 Rust Client Library | ✅ **PASSED** | ${CLIENT_LIB_PASSED:-0} | ${CLIENT_LIB_FAILED:-0} | ${CLIENT_LIB_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🦀 Rust Client Library | ❌ **FAILED** | ${CLIENT_LIB_PASSED:-0} | ${CLIENT_LIB_FAILED:-0} | ${CLIENT_LIB_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Rust CLI - CLEAR status
          if [ "$CLI_RESULT" = "passed" ]; then
            echo "| 🦀 Rust CLI | ✅ **PASSED** | ${CLI_PASSED:-0} | ${CLI_FAILED:-0} | ${CLI_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🦀 Rust CLI | ❌ **FAILED** | ${CLI_PASSED:-0} | ${CLI_FAILED:-0} | ${CLI_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Rust Doc Tests - CLEAR status
          if [ "$DOC_RESULT" = "passed" ]; then
            echo "| 🦀 Rust Doc Tests | ✅ **PASSED** | ${DOC_PASSED:-0} | ${DOC_FAILED:-0} | ${DOC_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🦀 Rust Doc Tests | ❌ **FAILED** | ${DOC_PASSED:-0} | ${DOC_FAILED:-0} | ${DOC_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Python Library - CLEAR status
          if [ "$PYTHON_RESULT" = "passed" ]; then
            echo "| 🐍 Python Library | ✅ **PASSED** | ${PYTHON_PASSED:-0} | ${PYTHON_FAILED:-0} | ${PYTHON_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🐍 Python Library | ❌ **FAILED** | ${PYTHON_PASSED:-0} | ${PYTHON_FAILED:-0} | ${PYTHON_IGNORED:-0} |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "| **TOTAL** | | **$TOTAL_PASSED** | **$TOTAL_FAILED** | **$TOTAL_IGNORED** |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "### 📥 Artifacts (JUnit XML + Logs)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | Contents |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`rust-client-lib-results-<server>\` | JUnit XML + logs for Rust client library, one per server |" >> $GITHUB_STEP_SUMMARY
          echo "| \`rust-cli-results-<server>\` | JUnit XML + logs for Rust CLI, one per server |" >> $GITHUB_STEP_SUMMARY
          echo "| \`rust-doc-results-<server>\` | JUnit XML + logs for Rust doc tests, one per server |" >> $GITHUB_STEP_SUMMARY
          echo "| \`python-lib-results-<server>\` | JUnit XML + logs for Python library, one per server |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          echo "> 💡 All logs include \`RUST_LOG=edgefirst_client=trace\` for detailed debugging" >> $GITHUB_STEP_SUMMARY
          
          # Add failure guidance if tests failed
          if [ "$ALL_PASSED" != "true" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "---" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔍 Troubleshooting" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "1. Download the artifact for the failed test suite" >> $GITHUB_STEP_SUMMARY
            echo "2. Check the JUnit XML file for test details" >> $GITHUB_STEP_SUMMARY
            echo "3. Search for \`FAILED\` or \`error\` in the log file" >> $GITHUB_STEP_SUMMARY
            echo "4. Look for \`TRACE\` entries for API call details" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Fail workflow if any tests failed
        run: |
          if [ "${{ needs.rust-client-lib.outputs.result }}" != "passed" ] || \
             [ "${{ needs.rust-cli.outputs.result }}" != "passed" ] || \
             [ "${{ needs.rust-doc.outputs.result }}" != "passed" ] || \
             [ "${{ needs.python-lib.outputs.result }}" != "passed" ]; then
            echo "::error::One or more test suites FAILED"
            exit 1
          fi
