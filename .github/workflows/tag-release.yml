# TAG. This is step 2 of 3:
#
#   release.yml      push to release/*.*.*  -> build every artifact
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag (this file)
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# The shared workflow passes the branch name through `env:` rather than
# interpolating it, creates an annotated tag object with RELEASE_TAG_TOKEN so
# the tag triggers publish.yml, and never builds anything.

name: Tag Release

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  tag:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/')
    uses: EdgeFirstAI/.github/.github/workflows/tag-release.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257  # v2.3.1
    # A called workflow can only narrow the caller's token, never widen it,
    # so grant exactly what the shared job declares rather than depend on the
    # repository's default token permissions.
    permissions:
      contents: write
      actions: read
    with:
      # No tag unless release.yml is green for the release-branch head being
      # merged. Branch protection cannot require it, because the release build
      # runs on a branch push rather than on the PR, so this is the one place
      # "the artifacts exist before the tag does" is enforced.
      require-build: release.yml
    secrets: inherit
