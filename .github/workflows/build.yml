name: Build CLI and Python Wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run when a PR is pushed again, but never on main:
# release.yml resolves this workflow's run for a specific SHA, and a blanket
# cancel would destroy the run a release depends on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned Rust version for CI/CD - update manually to control Rust upgrades
  # This ensures consistent builds and allows testing before upgrading
  RUST_STABLE_VERSION: "1.94"

jobs:
  build-cli:
    name: Build CLI - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            artifact_name: edgefirst-client
            asset_name: edgefirst-client-linux-amd64

          # Linux aarch64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            artifact_name: edgefirst-client
            asset_name: edgefirst-client-linux-arm64

          # macOS x86_64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos
            artifact_name: edgefirst-client
            asset_name: edgefirst-client-macos-amd64

          # macOS aarch64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            artifact_name: edgefirst-client
            asset_name: edgefirst-client-macos-arm64

          # Windows x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            artifact_name: edgefirst-client.exe
            asset_name: edgefirst-client-windows-amd64.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: ${{ matrix.target }}

      # Use Swatinem/rust-cache for proper incremental compilation caching
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Shared cache key with Python wheels for maximum reuse
          key: ${{ matrix.target }}-build
          shared-key: "build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # manylinux2014 compatibility: cargo-zigbuild pins the target glibc to
      # 2.17 (see the `.2.17` suffix on the build below). It shells out to
      # `zig`, which the ziglang wheel supplies, so both are needed.
      - name: Install zig (Linux)
        if: matrix.platform == 'linux'
        # `--only-binary=:all:` blocks an sdist fallback that could run setup
        # scripts (S8541); the pin locks the resolved version so a build is
        # reproducible and cannot silently drift (S8544). 0.16.0 is what the
        # previously unpinned install already resolved to, so this changes
        # nothing about what gets built.
        #
        # Block scalar (`|`) is required, not stylistic: as a flow scalar the
        # `: ` inside `=:all:` makes YAML parse the value as a mapping.
        run: |
          pip install --only-binary=:all: ziglang==0.16.0

      # Prebuilt binary rather than `cargo install`, which compiled
      # cargo-zigbuild from source on every Linux matrix job.
      - name: Install cargo-zigbuild (Linux)
        if: matrix.platform == 'linux'
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: cargo-zigbuild

      - name: Build CLI (Linux with zig)
        if: matrix.platform == 'linux'
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}.2.17 -p edgefirst-cli

      - name: Build CLI (macOS/Windows)
        if: matrix.platform != 'linux'
        run: cargo build --release --locked --target ${{ matrix.target }} -p edgefirst-cli

      # Verify GLIBC requirements for Linux binaries (manylinux2014 = glibc 2.17)
      - name: Verify GLIBC requirements (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking GLIBC requirements for ${{ matrix.target }}..."
          GLIBC_MAX=$(objdump -T "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" | grep GLIBC | sed 's/.*GLIBC_/GLIBC_/' | sed 's/).*//' | sort -V | tail -1)
          echo "Maximum GLIBC version required: $GLIBC_MAX"

          # Extract version numbers for comparison
          GLIBC_MAJOR=$(echo "$GLIBC_MAX" | cut -d'_' -f2 | cut -d'.' -f1)
          GLIBC_MINOR=$(echo "$GLIBC_MAX" | cut -d'_' -f2 | cut -d'.' -f2)

          # Check if version is <= 2.17 (manylinux2014)
          if [ "$GLIBC_MAJOR" -gt 2 ] || { [ "$GLIBC_MAJOR" -eq 2 ] && [ "$GLIBC_MINOR" -gt 17 ]; }; then
            echo "::error::Binary requires $GLIBC_MAX, but manylinux2014 only supports up to GLIBC_2.17"
            exit 1
          fi
          echo "✅ GLIBC requirements verified: $GLIBC_MAX <= GLIBC_2.17"

      - name: Rename binary
        shell: bash
        run: |
          mkdir -p artifacts
          # When --target is specified, cargo uses target/<triple>/release/
          # This applies to all builds since we always specify --target
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact_name }}" "artifacts/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.asset_name }}
          path: artifacts/${{ matrix.asset_name }}
          if-no-files-found: error

  build-wheels:
    name: Build Python Wheel - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    needs: [build-cli]  # Run after CLI builds to bundle CLI binary in wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux
            arch: x86_64
            cli_artifact: edgefirst-client-linux-amd64
            cli_binary: edgefirst-client

          # Linux aarch64
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            platform: linux
            arch: aarch64
            cli_artifact: edgefirst-client-linux-arm64
            cli_binary: edgefirst-client

          # macOS x86_64
          - os: macos-14
            target: x86_64-apple-darwin
            platform: macos
            arch: x86_64
            cli_artifact: edgefirst-client-macos-amd64
            cli_binary: edgefirst-client

          # macOS aarch64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            platform: macos
            arch: aarch64
            cli_artifact: edgefirst-client-macos-arm64
            cli_binary: edgefirst-client

          # Windows x86_64
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            platform: windows
            arch: x86_64
            cli_artifact: edgefirst-client-windows-amd64.exe
            cli_binary: edgefirst-client.exe

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      # Use same cache configuration as CLI builds for maximum reuse
      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ${{ matrix.target }}-build
          shared-key: "build"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Download CLI binary to bundle in the wheel
      - name: Download CLI binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ matrix.cli_artifact }}
          path: cli-binary

      # Set up maturin data directory with CLI binary as a script
      # Files in .data/scripts/ are installed as executables on the PATH
      - name: Bundle CLI binary in wheel (Unix)
        if: matrix.platform != 'windows'
        run: |
          mkdir -p crates/edgefirst-client-py/edgefirst_client.data/scripts
          cp cli-binary/${{ matrix.cli_artifact }} crates/edgefirst-client-py/edgefirst_client.data/scripts/${{ matrix.cli_binary }}
          chmod +x crates/edgefirst-client-py/edgefirst_client.data/scripts/${{ matrix.cli_binary }}
          echo "Bundled CLI binary:"
          ls -la crates/edgefirst-client-py/edgefirst_client.data/scripts/

      - name: Bundle CLI binary in wheel (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          mkdir -p crates/edgefirst-client-py/edgefirst_client.data/scripts
          cp cli-binary/${{ matrix.cli_artifact }} crates/edgefirst-client-py/edgefirst_client.data/scripts/${{ matrix.cli_binary }}
          echo "Bundled CLI binary:"
          ls -la crates/edgefirst-client-py/edgefirst_client.data/scripts/

      - name: Install maturin
        # Same hardening as the zig install above.
        run: |
          pip install --only-binary=:all: "maturin[zig]==1.14.1"

      # Install cross-compilation tools for Linux aarch64
      - name: Install cross-compilation tools (Linux aarch64)
        if: matrix.platform == 'linux' && matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      # Build wheels with zig for better cross-compilation support on Linux
      - name: Build wheels (Linux with zig)
        if: matrix.platform == 'linux'
        run: |
          maturin build --release --locked --zig --compatibility manylinux2014 \
            --target ${{ matrix.target }} \
            -m crates/edgefirst-client-py/Cargo.toml

      # Verify wheel contents for Linux (GLIBC + CLI binary)
      - name: Verify wheel contents (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          echo "Extracting and verifying wheel contents for ${{ matrix.target }}..."
          wheels=(target/wheels/*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::maturin produced no wheel for ${{ matrix.target }}"
            exit 1
          fi
          WHEEL_FILE="${wheels[0]}"
          TEMP_DIR=$(mktemp -d)
          unzip -q "$WHEEL_FILE" -d "$TEMP_DIR"

          echo "Wheel contents:"
          find "$TEMP_DIR" -type f | head -20

          # Verify CLI binary is included in wheel
          CLI_IN_WHEEL=$(find "$TEMP_DIR" -name "${{ matrix.cli_binary }}" | head -1)
          if [ -z "$CLI_IN_WHEEL" ]; then
            echo "❌ ERROR: CLI binary '${{ matrix.cli_binary }}' not found in wheel!"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "✅ CLI binary found in wheel: $CLI_IN_WHEEL"

          # Check the Python extension module (.so)
          SO_FILE=$(find "$TEMP_DIR" -name "*.so" | head -1)
          if [ -n "$SO_FILE" ]; then
            echo "Checking $SO_FILE..."
            GLIBC_MAX=$(objdump -T "$SO_FILE" | grep GLIBC | sed 's/.*GLIBC_/GLIBC_/' | sed 's/).*//' | sort -V | tail -1)
            echo "Python extension max GLIBC: $GLIBC_MAX"

            GLIBC_MAJOR=$(echo "$GLIBC_MAX" | cut -d'_' -f2 | cut -d'.' -f1)
            GLIBC_MINOR=$(echo "$GLIBC_MAX" | cut -d'_' -f2 | cut -d'.' -f2)

            if [ "$GLIBC_MAJOR" -gt 2 ] || { [ "$GLIBC_MAJOR" -eq 2 ] && [ "$GLIBC_MINOR" -gt 17 ]; }; then
              echo "❌ ERROR: Python extension requires $GLIBC_MAX, but manylinux2014 only supports up to GLIBC_2.17"
              rm -rf "$TEMP_DIR"
              exit 1
            fi
            echo "✅ Python extension GLIBC requirements verified: $GLIBC_MAX <= GLIBC_2.17"
          fi

          rm -rf "$TEMP_DIR"

      # Build wheels for macOS
      - name: Build wheels (macOS)
        if: matrix.platform == 'macos'
        run: |
          maturin build --release --locked \
            --target ${{ matrix.target }} \
            -m crates/edgefirst-client-py/Cargo.toml

      # Verify wheel contents for macOS
      - name: Verify wheel contents (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          echo "Verifying wheel contents for ${{ matrix.target }}..."
          WHEEL_FILE=$(ls target/wheels/*.whl)
          TEMP_DIR=$(mktemp -d)
          unzip -q "$WHEEL_FILE" -d "$TEMP_DIR"

          CLI_IN_WHEEL=$(find "$TEMP_DIR" -name "${{ matrix.cli_binary }}" | head -1)
          if [ -z "$CLI_IN_WHEEL" ]; then
            echo "❌ ERROR: CLI binary '${{ matrix.cli_binary }}' not found in wheel!"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "✅ CLI binary found in wheel: $CLI_IN_WHEEL"
          rm -rf "$TEMP_DIR"

      # Build wheels for Windows
      - name: Build wheels (Windows)
        if: matrix.platform == 'windows'
        run: maturin build --release --locked -m crates/edgefirst-client-py/Cargo.toml

      # Verify wheel contents for Windows
      - name: Verify wheel contents (Windows)
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          echo "Verifying wheel contents for ${{ matrix.target }}..."
          WHEEL_FILE=$(ls target/wheels/*.whl)
          TEMP_DIR=$(mktemp -d)
          unzip -q "$WHEEL_FILE" -d "$TEMP_DIR"

          CLI_IN_WHEEL=$(find "$TEMP_DIR" -name "${{ matrix.cli_binary }}" | head -1)
          if [ -z "$CLI_IN_WHEEL" ]; then
            echo "❌ ERROR: CLI binary '${{ matrix.cli_binary }}' not found in wheel!"
            rm -rf "$TEMP_DIR"
            exit 1
          fi
          echo "✅ CLI binary found in wheel: $CLI_IN_WHEEL"
          rm -rf "$TEMP_DIR"

      - name: Upload wheels
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: wheels-${{ matrix.platform }}-${{ matrix.arch }}
          path: target/wheels/*.whl
          if-no-files-found: error

  # Verify all binaries and wheels were built successfully
  verify:
    name: Verify Builds
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    needs: [build-cli, build-wheels]
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      # Asserts the expected counts rather than only reporting them. The
      # previous version piped `wc -l` into the job summary and always exited
      # 0, so a matrix entry that silently produced nothing still showed a
      # green "Verify Builds".
      - name: Verify artifacts
        env:
          EXPECTED_BINARIES: '5'   # linux x2, macos x2, windows
          EXPECTED_WHEELS: '5'     # one per CLI target
        run: |
          set -euo pipefail
          BINARIES=$(find artifacts -type f -name '*client*' -not -name '*.whl' | wc -l | tr -d ' ')
          WHEELS=$(find artifacts -type f -name '*.whl' | wc -l | tr -d ' ')

          {
            echo "## Build Artifacts"
            echo ""
            echo "- CLI binaries: ${BINARIES}/${EXPECTED_BINARIES}"
            echo "- Python wheels: ${WHEELS}/${EXPECTED_WHEELS}"
          } >> "$GITHUB_STEP_SUMMARY"

          rc=0
          if [ "$BINARIES" -ne "$EXPECTED_BINARIES" ]; then
            echo "::error::expected $EXPECTED_BINARIES CLI binaries, found $BINARIES"
            rc=1
          fi
          if [ "$WHEELS" -ne "$EXPECTED_WHEELS" ]; then
            echo "::error::expected $EXPECTED_WHEELS wheels, found $WHEELS"
            rc=1
          fi
          exit "$rc"
