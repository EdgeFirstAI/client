# RELEASE BUILD. This is step 1 of 3:
#
#   release.yml      push to release/*.*.*  -> build every artifact  (this file)
#   tag-release.yml  release PR merged      -> annotated vX.Y.Z tag
#   publish.yml      push of a v*.*.* tag   -> publish what was built
#
# It runs on `push` to the release branch rather than on `pull_request`. A
# pull_request run builds a merge-preview commit that exists nowhere in
# history, so publish.yml could never bind its artifacts to the tag; a push run
# builds the branch head, whose tree the release PR merges onto main.
#
# Accepting the release PR is the gate. tag-release.yml refuses to tag unless
# this is green for the merged head, and green here means every file the
# release ships -- CLI archives, wheels, packaged crates, SBOM, man page --
# already exists. Nothing is built after the tag.

name: Release Build

on:
  push:
    branches: ['release/*.*.*']   # release/X.Y.Z and release/X.Y.Z-rcN
  workflow_dispatch:              # rebuild a release branch on demand

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true        # a fixup commit supersedes the build it interrupts

permissions:
  contents: read

jobs:
  # Version consistency of Cargo.toml against the branch name, the workspace
  # dependency versions, the CHANGELOG section publish.yml renders the notes
  # from, and `cargo package --locked` for each crate. The packaged list is
  # recorded beside the .crate files and publish.yml refuses to publish a
  # different one.
  verify:
    uses: EdgeFirstAI/.github/.github/workflows/release-rust.yml@c7876194b9fe9f7f72daf0efadaf32d7dff1b257  # v2.3.1
    with:
      # The SBOM comes from this repository's sbom.yml below, which applies
      # its own license policy.
      sbom: false
      crate-packages: "edgefirst-client edgefirst-cli"
    secrets: inherit

  # The same CLI and wheel matrix every pull request builds, at the retention
  # the tag needs.
  artifacts:
    needs: verify
    uses: ./.github/workflows/build.yml
    with:
      retention-days: 30

  sbom:
    needs: verify
    uses: ./.github/workflows/sbom.yml
    with:
      retention-days: 30

  manpage:
    name: Man page
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Generate man page
        run: pandoc CLI.md --standalone --to man --output edgefirst-client.1

      - name: Upload man page
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manpage
          path: edgefirst-client.1
          if-no-files-found: error
          retention-days: 30
