name: Test and Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run when a PR is pushed again, but never on main.
# release.yml waits for a build.yml run on a specific SHA, and a blanket
# cancel would let a follow-up push kill the very run a release depends on.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs opt into more where they genuinely need it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned Rust version for CI/CD - update manually to control Rust upgrades
  # This ensures consistent builds and allows testing before upgrading
  RUST_STABLE_VERSION: "1.94"

jobs:
  # Formatting and clippy. Split from `test` so a lint failure reports in about
  # a minute instead of behind the full test suite, and so the clippy report can
  # be handed to SonarCloud (see the sonarcloud job).
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Cheap and needs no toolchain, so it runs before anything is installed.
      # The script has been in the repo since 7056a9a but was never invoked by
      # a workflow, so no push has ever actually been audited.
      - name: Audit workflows for script injection
        run: ./.github/scripts/audit-injection.sh .

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # First, because it needs no build: a formatting slip fails in seconds
      # rather than after clippy has compiled the workspace.
      - name: Check formatting
        run: cargo fmt --all --check

      # `--message-format=json` so the run can be handed to SonarCloud, which
      # would otherwise compile the workspace with clippy a second time and
      # report a different set of lints than CI enforces.
      #
      # jq renders the human-readable form back into the log, which the JSON
      # format otherwise suppresses -- a clippy failure that prints only raw
      # JSON is unreadable. `pipefail` keeps cargo's exit status from being
      # masked by tee/jq.
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked --message-format=json \
            | tee clippy-report.json \
            | jq -r 'select(.reason == "compiler-message") | .message.rendered // empty'

      - name: Upload clippy report for SonarCloud
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: always()
        with:
          name: clippy-report-linux
          path: clippy-report.json
          if-no-files-found: error
          retention-days: 7

  # Rust and Python tests share one job on purpose. `cargo llvm-cov show-env` is
  # exported into the environment before the maturin build, so the Python
  # extension module is compiled instrumented and the profraw it emits during
  # pytest feeds the same lcov.info as the Rust unit tests. Splitting the two
  # would mean a second instrumented build of the whole workspace for no gain.
  test:
    name: Tests and coverage
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 45
    permissions:
      contents: read
      checks: write        # publish-unit-test-result-action creates a check run
      pull-requests: write # ...and comments the summary on PRs
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7bc99eee1f1b8902a125006cf790a1f4c8461e63 # v2.69.8
        with:
          tool: nextest

      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.11'

      # Before instrumentation: doc tests and llvm-cov's build settings do not
      # coexist, and running them first keeps the instrumented target directory
      # from being polluted by an uninstrumented build.
      - name: Run Rust doc tests (before coverage instrumentation)
        run: cargo test --doc --locked
        env:
          STUDIO_SERVER: test
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      # Exported into GITHUB_ENV so every later cargo/maturin invocation in this
      # job inherits the instrumentation flags.
      - name: Set up coverage environment
        if: success() || failure()
        run: |
          cargo llvm-cov show-env --sh --no-cfg-coverage | sed "s/^export //;s/'//g" >> "$GITHUB_ENV"

      - name: Build with coverage
        if: success() || failure()
        run: cargo build --locked

      - name: Run Rust unit tests
        if: success() || failure()
        run: cargo nextest run --locked --no-fail-fast --profile ci
        env:
          STUDIO_SERVER: test
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      - name: Install Python dependencies
        if: success() || failure()
        # `--require-hashes` forces pip to verify every artifact
        # against the SHA-256 lock baked into ``requirements.txt``
        # (regenerated via ``pip-compile --generate-hashes``).
        # `--only-binary=:all:` blocks pip from falling back to sdist
        # (which could run setup.py). Together they satisfy
        # SonarCloud githubactions:S8541 and S8544 by hardening the
        # supply-chain entrypoint. The `=` form is used so YAML
        # doesn't misparse the `:all:` token as a mapping delimiter.
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt

      - name: Build Python package
        if: success() || failure()
        run: maturin build --locked -m crates/edgefirst-client-py/Cargo.toml

      - name: Install Python package
        if: success() || failure()
        # The target/wheels/*.whl was built from in-tree source in
        # the previous step. To satisfy SonarCloud githubactions:S8544
        # we compute the wheel's SHA-256 right here and feed pip a
        # one-line constraints file with that hash, then install via
        # `--require-hashes` so pip refuses to proceed if the wheel
        # changes between hashing and installation. `--no-deps` keeps
        # pip from re-resolving transitive deps (already installed
        # from the hashed requirements.txt above) and
        # `--only-binary=:all:` blocks any sdist fallback (S8541).
        # Block scalar (`|`) is used so YAML doesn't parse the
        # `:all:` token as a mapping separator.
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Glob into an array rather than `ls | head -1`: an empty result is
          # then an explicit failure instead of an empty $WHEEL that silently
          # produces a malformed constraints file.
          wheels=("$PWD"/target/wheels/edgefirst_client-*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::maturin produced no wheel in target/wheels"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          HASH=$(pip hash --algorithm sha256 "$WHEEL" | grep -E '^--hash=' | head -1)
          printf 'edgefirst-client @ file://%s %s\n' "$WHEEL" "$HASH" > /tmp/wheel-constraint.txt
          pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/wheel-constraint.txt

      - name: Run Python tests
        if: success() || failure()
        run: python3 -m slipcover --xml --out coverage.xml -m xmlrunner discover -s . -p "test*.py" -o target/python
        env:
          STUDIO_SERVER: test
          STUDIO_USERNAME: ${{ secrets.STUDIO_USERNAME }}
          STUDIO_PASSWORD: ${{ secrets.STUDIO_PASSWORD }}
          TEST_DATASET_TYPES: box2d,box3d,mask

      # One lcov for both languages: the Rust unit tests and the instrumented
      # extension module exercised by the Python suite write into the same
      # profraw set.
      - name: Generate coverage report
        if: success() || failure()
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage for SonarCloud
        if: success() || failure()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.xml
          if-no-files-found: error
          retention-days: 7

      # `action_fail: true` makes this step the single authority on test
      # outcome for both languages -- it fails the job on any failure recorded
      # in either JUnit report, so the earlier steps need no separate
      # outcome-checking shims.
      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        if: success() || failure()
        with:
          files: |
            target/nextest/ci/junit.xml
            target/python/TEST-*.xml
          check_name: Test Results (Rust + Python)
          comment_title: EdgeFirst Client Test Results
          comment_mode: always
          fail_on: test failures
          action_fail: true
          action_fail_on_inconclusive: true
          job_summary: true
          compare_to_earlier_commit: true
          check_run_annotations: all tests, skipped tests

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: [lint, test]
    timeout-minutes: 20
    # Forks cannot read SONAR_TOKEN, so the scan is skipped rather than failed.
    #
    # Deliberately NOT gated on `test` succeeding. The `test` job uploads both
    # coverage-reports and its clippy counterpart under `success() || failure()`,
    # so a failing test still leaves Sonar everything it needs. Requiring success
    # meant a single red integration test took all static analysis and the
    # quality gate down with it -- which is exactly when that analysis is most
    # worth having. `lint` must still succeed, because its clippy report is a
    # hard input and the scan below fails loudly without it.
    #
    # `!cancelled()` rather than `always()`: a cancelled run has no artifacts,
    # and the download would fail confusingly.
    if: >
      !cancelled() &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.lint.result == 'success' &&
      needs.test.result != 'skipped'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-reports

      # Globbed rather than named so adding a second lint platform later needs
      # no edit here. Downloaded without merge-multiple because every report is
      # called clippy-report.json and they would otherwise overwrite each other.
      - name: Download clippy reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: clippy-report-*
          path: clippy/

      - name: Collect clippy reports
        # Fail loudly on an empty list. Passing no report would make the scan
        # silently fall back to reporting no clippy issues at all, which is
        # exactly the green-but-wrong outcome this import exists to prevent.
        run: |
          set -euo pipefail
          find clippy/ -type f -name '*.json'

          CLIPPY_REPORTS=$(find clippy/ -name '*.json' -type f | sort | tr '\n' ',' | sed 's/,$//')
          if [ -z "$CLIPPY_REPORTS" ]; then
            echo "::error::No clippy reports found — expected at least one clippy-report-* artifact"
            exit 1
          fi

          echo "Clippy: $CLIPPY_REPORTS"
          echo "CLIPPY_REPORT_PATHS=$CLIPPY_REPORTS" >> "$GITHUB_ENV"

      - name: Verify coverage files
        run: |
          set -euo pipefail
          for f in lcov.info coverage.xml; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty — coverage would be reported as zero"
              exit 1
            fi
            echo "$f: $(wc -l < "$f") lines"
          done

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.rust.clippy.reportPaths=${{ env.CLIPPY_REPORT_PATHS }}

      - name: SonarCloud Quality Gate check
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        # Don't fail the build on quality gate - report only
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate SonarCloud summary
        if: always()
        run: |
          {
            echo "## 🔍 SonarCloud Analysis"
            echo ""
            echo "[View Full Report →](https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }})"
          } >> "$GITHUB_STEP_SUMMARY"
