name: Test and Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run when a PR is pushed again, but never on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Pinned Rust version for CI/CD - update manually to control Rust upgrades
  # This ensures consistent builds and allows testing before upgrading
  RUST_STABLE_VERSION: "1.99"

jobs:
  # Formatting and clippy. Split from `test` so a lint failure reports in about
  # a minute instead of behind the full test suite, and so the clippy report can
  # be handed to SonarCloud (see the sonarcloud job).
  lint:
    name: Lint and format
    runs-on: ubuntu-24.04-xlarge
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cheap and needs no toolchain, so it runs before anything is installed.
      # The script has been in the repo since 7056a9a but was never invoked by
      # a workflow, so no push has ever actually been audited.
      - name: Audit workflows for script injection
        run: ./.github/scripts/audit-injection.sh .

      # Fails when a new RPC method is called without a wiremock test. Also
      # needs no toolchain, so it reports in seconds alongside the audit above.
      #
      # A ratchet against .github/rpc-mock-baseline.txt, not a coverage
      # threshold: existing gaps are tolerated, new ones are not. Without this,
      # a newly wired API is exercised only by the nightly Studio run, so its
      # first failure lands hours later against a commit range instead of the
      # pull request responsible.
      - name: Check new RPC methods have wiremock tests
        run: ./.github/scripts/rpc-mock-coverage.sh

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # First, because it needs no build: a formatting slip fails in seconds
      # rather than after clippy has compiled the workspace.
      - name: Check formatting
        run: cargo fmt --all --check

      # `--message-format=json` so the run can be handed to SonarCloud, which
      # would otherwise compile the workspace with clippy a second time and
      # report a different set of lints than CI enforces.
      #
      # jq renders the human-readable form back into the log, which the JSON
      # format otherwise suppresses -- a clippy failure that prints only raw
      # JSON is unreadable. `pipefail` keeps cargo's exit status from being
      # masked by tee/jq.
      - name: Clippy
        run: |
          set -o pipefail
          cargo clippy --all-targets --all-features --locked --message-format=json \
            | tee clippy-report.json \
            | jq -r 'select(.reason == "compiler-message") | .message.rendered // empty'

      - name: Upload clippy report for SonarCloud
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: clippy-report-linux
          path: clippy-report.json
          if-no-files-found: error
          retention-days: 7

  # PR feedback lane. Deliberately contains NO Studio integration tests.
  #
  # Those tests are 68 of 788 but were 99.4% of the runtime: measured on one
  # run, the `cli` binary summed to 116.3 minutes while every other binary
  # summed to 0.7. They also hit a shared server, so they brought contention,
  # flakiness from server-side issues, and a hard dependency on secrets that
  # fork PRs cannot read.
  #
  # They are not lost -- studio.yml exists precisely to run them, on demand
  # against a chosen server and nightly across test/stage/saas. This lane had
  # simply been duplicating that work on every push.
  #
  # What remains needs no credentials at all: 720 nextest tests in 6.2s, 62 doc
  # tests in 2.3s, and the Python files that do not construct a Client. Wall
  # clock here is compilation, not testing.
  test:
    name: Tests and coverage
    # Still xlarge: what is left is dominated by compiling, which is genuinely
    # CPU-bound. It was only test *execution* that had to stop being parallel
    # against a shared server.
    runs-on: ubuntu-24.04-xlarge
    # No Studio calls left, so runtime is predictable. The 90 minutes this
    # needed before was entirely the integration suite.
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write        # publish-unit-test-result-action creates a check run
      pull-requests: write # ...and comments the summary on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUST_STABLE_VERSION }}
          components: llvm-tools-preview

      - name: Cache Rust dependencies and build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-llvm-cov

      - name: Install cargo-nextest
        uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: nextest

      - name: Install Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # Before instrumentation: doc tests and llvm-cov's build settings do not
      # coexist, and running them first keeps the instrumented target directory
      # from being polluted by an uninstrumented build.
      - name: Run Rust doc tests (before coverage instrumentation)
        run: cargo test --doc --locked

      # Writes the instrumented environment to /tmp/coverage-env.sh rather than
      # exporting it into GITHUB_ENV. The distinction is load-bearing: the Rust
      # step below uses `cargo llvm-cov nextest`, which applies its own
      # instrumentation and fails if it inherits one already applied. Only the
      # maturin and Python steps source the file.
      - name: Set up coverage instrumentation
        if: success() || failure()
        run: ./.github/scripts/setup-coverage-env.sh

      # `cargo llvm-cov nextest`, not a bare `cargo nextest run` under an
      # exported environment. That distinction is the whole reason integration
      # coverage works: with the bare form, the integration test binaries are
      # built and run but their counters never reach the report, so every path
      # reachable only from tests/ reads as uncovered. It looked like the mocks
      # were not counted; in fact their coverage was being discarded.
      #
      # `--no-report` defers the report until the Python tests have also run, so
      # both feed one lcov.
      #
      # `not binary(cli)` is the whole split. Everything excluded here runs in
      # studio.yml against a real server.
      - name: Run Rust unit tests
        if: success() || failure()
        run: |
          cargo llvm-cov nextest --no-report \
            --locked --no-fail-fast --profile ci -E 'not binary(cli)'

      - name: Install Python dependencies
        if: success() || failure()
        # `--require-hashes` forces pip to verify every artifact
        # against the SHA-256 lock baked into ``requirements.txt``
        # (regenerated via ``pip-compile --generate-hashes``).
        # `--only-binary=:all:` blocks pip from falling back to sdist
        # (which could run setup.py). Together they satisfy
        # SonarCloud githubactions:S8541 and S8544 by hardening the
        # supply-chain entrypoint. The `=` form is used so YAML
        # doesn't misparse the `:all:` token as a mapping delimiter.
        run: |
          pip install --require-hashes --only-binary=:all: -r requirements.txt

      # Sources the coverage env so the extension module is built instrumented
      # and lands in cargo-llvm-cov's target tree, where `report` can find its
      # object file. That redirect is why the wheel is under
      # target/llvm-cov-target/wheels below rather than target/wheels.
      - name: Build Python package
        if: success() || failure()
        run: |
          set -euo pipefail
          source /tmp/coverage-env.sh
          maturin build --locked -m crates/edgefirst-client-py/Cargo.toml

      - name: Install Python package
        if: success() || failure()
        # The target/wheels/*.whl was built from in-tree source in
        # the previous step. To satisfy SonarCloud githubactions:S8544
        # we compute the wheel's SHA-256 right here and feed pip a
        # one-line constraints file with that hash, then install via
        # `--require-hashes` so pip refuses to proceed if the wheel
        # changes between hashing and installation. `--no-deps` keeps
        # pip from re-resolving transitive deps (already installed
        # from the hashed requirements.txt above) and
        # `--only-binary=:all:` blocks any sdist fallback (S8541).
        run: |
          set -euo pipefail
          shopt -s nullglob
          # Glob into an array rather than `ls | head -1`: an empty result is
          # then an explicit failure instead of an empty $WHEEL that silently
          # produces a malformed constraints file.
          # Under target/llvm-cov-target because the coverage env redirects
          # CARGO_TARGET_DIR there so the instrumented .so is where
          # `cargo llvm-cov report` looks for it.
          wheels=("$PWD"/target/llvm-cov-target/wheels/edgefirst_client-*.whl)
          if [ ${#wheels[@]} -eq 0 ]; then
            echo "::error::maturin produced no wheel in target/llvm-cov-target/wheels"
            exit 1
          fi
          WHEEL="${wheels[0]}"
          HASH=$(pip hash --algorithm sha256 "$WHEEL" | grep -E '^--hash=' | head -1)
          printf 'edgefirst-client @ file://%s %s\n' "$WHEEL" "$HASH" > /tmp/wheel-constraint.txt
          pip install --require-hashes --no-deps --only-binary=:all: -r /tmp/wheel-constraint.txt

      # Catches a wheel that builds but cannot load -- an ABI mismatch, a missing
      # symbol, or a class dropped from the #[pymodule] export table -- in
      # seconds, which is the failure mode that most wants fast feedback on a PR.
      #
      # There is deliberately no __version__ check: the extension module does not
      # export one. Asserting on the exported classes tests something that
      # actually exists.
      - name: Smoke-test the wheel
        if: success() || failure()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import edgefirst_client

          expected = [
              "Client",
              "Project",
              "Dataset",
              "Experiment",
              "Snapshot",
              "GpsData",
              "ImuData",
          ]
          missing = [name for name in expected if not hasattr(edgefirst_client, name)]
          if missing:
              raise SystemExit(f"edgefirst_client is missing exports: {missing}")

          print("edgefirst_client imported OK, exports present:", ", ".join(expected))
          PY

      # Only the Python tests that need no Studio: they construct no Client,
      # or point one at a local stub server. The Studio-backed Python suite
      # runs in studio.yml.
      # Named individually rather than discovered, because most of test/ needs a
      # live Studio. test_ids is split by class for the same reason: its
      # conversion tests are pure ID translation, while TestIDTypes calls
      # get_client and belongs to studio.yml.
      # Sources the coverage env so the instrumented extension module writes
      # profraw where `cargo llvm-cov report` will find it. This is what makes
      # the PyO3 crate appear in the Rust lcov at all.
      - name: Run Python tests (no Studio)
        if: success() || failure()
        run: |
          set -euo pipefail
          source /tmp/coverage-env.sh
          python3 -m slipcover --xml --out coverage.xml -m xmlrunner \
            test.test_coco_roundtrip test.test_storage test.test_parameter \
            test.test_ids.TestIDConversions test.test_ids.TestBackgroundTaskID \
            test.test_sample_metadata test.test_example_paths test.test_set_platform test.test_recycle_bin test.test_sequence_uuids test.test_mask_offset test.test_coco_rle_pycocotools test.test_ade20k test.test_dataset_metadata \
            -o target/python

      # Merges the deferred Rust run with the Python run into one lcov. Asserts
      # the integration binaries actually contributed: this whole sequence
      # previously reported success while silently discarding every path
      # reachable only from tests/, so a bare "report written" is not evidence
      # that it worked.
      - name: Generate coverage report
        if: success() || failure()
        run: |
          set -euo pipefail
          cargo llvm-cov report \
            --ignore-filename-regex '(\.cargo|/rustc/)' \
            --lcov --output-path lcov.info

          echo "source files in report: $(grep -c '^SF:' lcov.info)"

          # Canary. `Client::organization` is reachable only from the wiremock
          # integration tests, so a zero hit count means the integration
          # binaries were dropped from the report again -- which is exactly the
          # failure this sequence was rewritten to fix, and which is invisible
          # otherwise because every test still passes.
          LINE=$(grep -n 'pub async fn organization' crates/edgefirst-client/src/client.rs | head -1 | cut -d: -f1)
          HITS=$(awk -v l="$LINE" '
            /^SF:.*edgefirst-client\/src\/client\.rs$/ {f=1; next}
            f && /^end_of_record/ {exit}
            f && /^DA:/ { split(substr($0,4),a,","); if (a[1]==l) print a[2] }
          ' lcov.info)
          echo "canary Client::organization (client.rs:$LINE) hits=${HITS:-<absent>}"
          if [ "${HITS:-0}" = "0" ]; then
            echo "::error::Integration test coverage is missing from lcov.info."
            echo "::error::Client::organization is covered by wiremock tests but reports 0 hits."
            echo "::error::Check that the Rust step uses 'cargo llvm-cov nextest', not a bare 'cargo nextest run'."
            exit 1
          fi

          if ! grep -q '^SF:.*edgefirst-client-py/src/lib.rs' lcov.info; then
            echo "::warning::PyO3 crate missing from coverage — the maturin build may not have been instrumented"
          fi

      - name: Upload coverage for SonarCloud
        if: success() || failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: |
            lcov.info
            coverage.xml
          if-no-files-found: error
          retention-days: 7

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@7622c5bf3d112a72ab4fa3951c2aa5723d8ab92d # v2.25.0
        if: success() || failure()
        with:
          files: |
            target/nextest/ci/junit.xml
            target/python/TEST-*.xml
          check_name: Test Results (Rust + Python)
          comment_title: EdgeFirst Client Test Results
          comment_mode: always
          fail_on: test failures
          action_fail: true
          action_fail_on_inconclusive: true
          job_summary: true
          compare_to_earlier_commit: true
          check_run_annotations: all tests, skipped tests

  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-24.04
    needs: [lint, test]
    timeout-minutes: 20
    # Forks cannot read SONAR_TOKEN, so the scan is skipped rather than failed.
    #
    # Deliberately NOT gated on `test` succeeding. The `test` job uploads both
    # coverage-reports and its clippy counterpart under `success() || failure()`,
    # so a failing test still leaves Sonar everything it needs. Requiring success
    # meant a single red integration test took all static analysis and the
    # quality gate down with it -- which is exactly when that analysis is most
    # worth having. `lint` must still succeed, because its clippy report is a
    # hard input and the scan below fails loudly without it.
    #
    # `success` or `failure` only -- never `cancelled` or `skipped`. Those two
    # are the cases where `test` produced no artifacts at all, and running the
    # scan then just fails on the download, turning one confusing red X into
    # two. It happens more than it sounds: `cancel-in-progress` cancels every
    # superseded PR push, and a job killed by `timeout-minutes` is also
    # reported as `cancelled` rather than `failed`.
    #
    # `!cancelled()` alone does NOT express that: it reports whether THIS job is
    # being cancelled and says nothing about a dependency's state, so a cancelled
    # `test` still satisfied it. The explicit `needs.test.result` checks below are
    # what actually discriminate.
    #
    # It still has to be here though, for a completely different reason. GitHub
    # wraps every `if:` in an implicit `success()` unless the expression already
    # contains a status check function (`always()`, `cancelled()`, `failure()`,
    # `success()`). Without one, the implicit gate skips this job the moment
    # `test` goes red -- before the `needs.test.result == 'failure'` branch is
    # ever consulted, so that branch can never fire. `!cancelled()` supplies the
    # status function; the `needs.*.result` checks supply the logic. Dropping
    # either half silently takes SonarCloud offline exactly when a test fails.
    #
    # Pull requests only. The default branch is analysed by studio.yml's nightly
    # instead, because that run has both unit and Studio coverage while this one
    # has unit coverage alone. Both write to the same SonarCloud project, so
    # letting this job also scan `main` would overwrite the fuller number with
    # the thinner one and leave project coverage flapping by roughly nine points
    # depending on which workflow landed last.
    if: >
      !cancelled() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.lint.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'failure')
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for better analysis

      - name: Download coverage reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-reports

      # Globbed rather than named so adding a second lint platform later needs
      # no edit here. Downloaded without merge-multiple because every report is
      # called clippy-report.json and they would otherwise overwrite each other.
      - name: Download clippy reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: clippy-report-*
          path: clippy/

      - name: Collect clippy reports
        # Fail loudly on an empty list. Passing no report would make the scan
        # silently fall back to reporting no clippy issues at all, which is
        # exactly the green-but-wrong outcome this import exists to prevent.
        run: |
          set -euo pipefail
          find clippy/ -type f -name '*.json'

          CLIPPY_REPORTS=$(find clippy/ -name '*.json' -type f | sort | tr '\n' ',' | sed 's/,$//')
          if [ -z "$CLIPPY_REPORTS" ]; then
            echo "::error::No clippy reports found — expected at least one clippy-report-* artifact"
            exit 1
          fi

          echo "Clippy: $CLIPPY_REPORTS"
          echo "CLIPPY_REPORT_PATHS=$CLIPPY_REPORTS" >> "$GITHUB_ENV"

      - name: Verify coverage files
        run: |
          set -euo pipefail
          for f in lcov.info coverage.xml; do
            if [ ! -s "$f" ]; then
              echo "::error::$f missing or empty — coverage would be reported as zero"
              exit 1
            fi
            echo "$f: $(wc -l < "$f") lines"
          done

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.rust.clippy.reportPaths=${{ env.CLIPPY_REPORT_PATHS }}

      - name: SonarCloud Quality Gate check
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        # Don't fail the build on quality gate - report only
        continue-on-error: true
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Generate SonarCloud summary
        if: always()
        run: |
          {
            echo "## 🔍 SonarCloud Analysis"
            echo ""
            echo "[View Full Report →](https://sonarcloud.io/project/overview?id=${{ github.repository_owner }}_${{ github.event.repository.name }})"
          } >> "$GITHUB_STEP_SUMMARY"
