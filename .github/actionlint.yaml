# Larger GitHub-hosted runners provisioned at the EdgeFirstAI org level.
#
# actionlint validates `runs-on:` against its built-in list of public labels and
# has no way to see org-level runner groups, so without this file every use of a
# larger runner is reported as an unknown label. Declaring them here keeps a
# local or CI `actionlint` run signal-only, so a genuine typo in a runner label
# still fails instead of being lost among expected warnings.
#
# Keep in step with the runner groups configured for the organization; the same
# set is used by EdgeFirstAI/profiler.
self-hosted-runner:
  labels:
    - ubuntu-24.04-xlarge
    - ubuntu-22.04-large
    - ubuntu-22.04-xlarge
    - ubuntu-22.04-arm-large
    - ubuntu-22.04-arm-xlarge
    - macos-14-xlarge
