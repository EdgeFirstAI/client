sonar.organization=edgefirstai
sonar.projectKey=EdgeFirstAI_client
sonar.projectName=EdgeFirst Client
sonar.sources=.
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Mark test files explicitly - this excludes them from source analysis and issue reporting
sonar.test.inclusions=test/**/*.py,crates/*/tests/**/*

# Ignore issues in inline Rust test modules (blocks between #[cfg(test)] and closing brace)
sonar.issue.ignore.block=e1
sonar.issue.ignore.block.e1.beginBlockRegexp=^\\s*#\\[cfg\\(test\\)\\]
sonar.issue.ignore.block.e1.endBlockRegexp=^\\s*}\\s*$

# Python configuration
sonar.python.version=3.8,3.9,3.10,3.11,3.12
sonar.python.coverage.reportPaths=coverage.xml

# Rust configuration
# lcov.info covers both the Rust unit tests and the FFI paths the Python
# tests exercise: the `test` job exports `cargo llvm-cov show-env` into the
# environment before the maturin build, so the extension module is built
# instrumented and its profraw feeds the same report.
sonar.rust.lcov.reportPaths=lcov.info
sonar.rust.edition=2024

# sonar.rust.clippy.reportPaths is deliberately NOT set here. It is passed as
# a -D scan argument from the sonarcloud job, whose value is the set of
# clippy-report-* artifacts downloaded at run time. Importing the report is
# what stops the scanner from compiling the workspace with clippy a second
# time and reporting a different (feature-poorer) set of lints than CI
# enforces.

# Multicriteria issue ignores for specific false positives.
sonar.issue.ignore.multicriteria=cargolock,maturinpyproject

# text:S8570 wants Cargo.lock present alongside every Cargo.toml that
# declares dependencies. In a Cargo workspace, all member crates share a
# single Cargo.lock at the workspace root — there is no per-member
# lockfile by design, and Cargo enforces this rule. The Sonar text-rule
# applies its heuristic per Cargo.toml and so always misfires on every
# workspace member. Ignore the rule on member-crate manifests; the
# workspace-root Cargo.toml has no [dependencies] block and is unaffected.
sonar.issue.ignore.multicriteria.cargolock.ruleKey=text:S8570
sonar.issue.ignore.multicriteria.cargolock.resourceKey=crates/*/Cargo.toml

# text:S8565 wants a uv.lock / poetry.lock next to every pyproject.toml
# that declares [project] dependencies. The edgefirst-client-py
# pyproject.toml is consumed by maturin, not uv or Poetry: maturin
# builds the wheel from the workspace Cargo.lock and the dependencies
# listed here become Requires-Dist metadata in the wheel itself, to be
# resolved by the consumer's pip on install. There is no build-time
# resolution we could pin with uv.lock, and adding a uv toolchain just
# to satisfy the rule would expand the dev surface for no reproducibility
# gain (the bytes in the wheel are already determined by Cargo.lock
# plus the bounded range on the single runtime dep). Range is pinned
# in pyproject.toml itself; the workspace `requirements.txt` carries
# the hash-locked test dependencies separately.
sonar.issue.ignore.multicriteria.maturinpyproject.ruleKey=text:S8565
sonar.issue.ignore.multicriteria.maturinpyproject.resourceKey=crates/edgefirst-client-py/pyproject.toml

# Disable C/C++/Obj-C analysis
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

# Ignore duplicates in test files
sonar.cpd.exclusions=**/tests/**,**/test_*.py,test.py

# Ignore coverage for development scripts
sonar.coverage.exclusions=sonar.py
